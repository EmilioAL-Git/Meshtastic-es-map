<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>En vivo · Red Meshtastic España</title>

<!-- Leaflet (self-hosted: sin dependencia de disponibilidad de unpkg) -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=1.9.4"/>
<script src="vendor/leaflet/leaflet.js?v=1.9.4"></script>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css?v=1.4.0"/>
</head>

<body class="live-page">

<!-- Header -->
<header>
  <a class="back-link" href="index.html">
    ← <span>Volver al mapa</span>
  </a>
  <div class="logo">
    <span>MESHTASTIC ESPAÑA <em>/ En vivo</em></span>
  </div>

  <div class="stats-bar">
    <div class="conn-badge" id="conn-badge">
      <span class="conn-dot"></span>
      <span id="conn-label">Conectando…</span>
    </div>
  </div>
</header>

<!-- Main -->
<div class="main">
  <div id="map">
    <button class="live-log-toggle-btn" id="live-log-toggle-btn" onclick="toggleLiveLogPanel()" title="Paquetes">
      <svg viewBox="0 0 16 16" fill="none">
        <rect x="2" y="3" width="12" height="2" rx="1" fill="currentColor"/>
        <rect x="2" y="7" width="12" height="2" rx="1" fill="currentColor"/>
        <rect x="2" y="11" width="7" height="2" rx="1" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <div class="live-log" id="live-log">
    <div class="live-log-empty" id="live-log-empty">Esperando paquetes…</div>
  </div>
</div>

<script src="js/state.js?v=1.4.0"></script>
<script src="js/live.js?v=1.4.0"></script>
</body>
</html>
