limit_req_zone  $binary_remote_addr zone=livews:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=livews_conn:10m;

server {
    listen 80;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # /live.html redirige a la URL limpia /live.
    location = /live.html {
        return 301 /live;
    }

    location / {
        # /index.html -> / : usamos $request_uri (URI original del cliente),
        # no $uri, porque el directorio "index" de nginx internamente
        # reescribe "/" a "/index.html" y vuelve a pasar por este location;
        # comparar contra $uri aquí crearía un 301 también para "/".
        if ($request_uri = /index.html) {
            return 301 /;
        }

        # =404: un JSON o asset que falte debe dar 404, no devolver index.html
        # $uri.html permite servir /live como alias de /live.html
        try_files $uri $uri.html $uri/ =404;
        expires 1m;
        add_header Cache-Control "public, max-age=60";

        # Cabeceras de seguridad
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
        # Sin 'unsafe-inline' en scripts: no hay <script> ni onclick inline
        # (ver manejadores declarativos data-on-* en state.js). Los estilos
        # inline sí se permiten (atributos style="" y Leaflet).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'";
    }

    # Datos JSON generados por el collector
    location /data/ {
        alias /data/json/;
        expires -1;
        add_header Cache-Control "no-store";
        # add_header no se hereda desde "location /": se repiten aquí.
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Feed en vivo (WebSocket) — proxy al servicio livefeed.
    # Los endpoints HTTP (/packet, /activity, /timeline) comparten ruta con el
    # WS, así que el rate limit va por IP en toda la ubicación (burst holgado:
    # una página abre 1 WS + unas pocas consultas de historial).
    location /live-ws/ {
        limit_req zone=livews burst=30 nodelay;
        limit_conn livews_conn 20;
        proxy_pass http://livefeed:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /var/log/nginx/meshtastic-es-map_access.log;
    error_log  /var/log/nginx/meshtastic-es-map_error.log;
}
