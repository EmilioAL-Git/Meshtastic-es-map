##
## Nginx config para meshtastic-es-map
## Coloca en: /etc/nginx/sites-available/meshtastic-es-map
## Activa con: ln -s /etc/nginx/sites-available/meshtastic-es-map /etc/nginx/sites-enabled/
##
## Ajusta:
##   server_name  → tu dominio o IP
##   root         → ruta a la carpeta web/
##

server {
    listen 80;
    server_name tu-dominio.com;    # ← cambia esto

    # ── Mapa estático ─────────────────────────────────────────────────────────
    root /opt/meshtastic-es-map/web;
    index index.html;

    # /live.html redirige a la URL limpia /live.
    location = /live.html {
        return 301 /live;
    }

    location / {
        # /index.html -> / : usamos $request_uri (URI original del cliente),
        # no $uri, porque el directorio "index" de nginx internamente
        # reescribe "/" a "/index.html" y vuelve a pasar por este location;
        # comparar contra $uri aquí crearía un 301 también para "/".
        if ($request_uri = /index.html) {
            return 301 /;
        }

        # =404: un JSON o asset que falte debe dar 404, no devolver index.html
        # $uri.html permite servir /live como alias de /live.html
        try_files $uri $uri.html $uri/ =404;

        # Cabeceras de seguridad
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";

        # Cache corto para el HTML (el JS actualiza los datos)
        expires 1m;
        add_header Cache-Control "public, max-age=60";
    }

    # ── Feed en vivo (WebSocket) ─────────────────────────────────────────────
    # Solo aplica si además despliegas el servicio livefeed como proceso/unidad
    # systemd aparte en esta misma máquina (fuera de alcance por ahora — el
    # feed en vivo solo está soportado vía Docker Compose, donde "livefeed"
    # resuelve por DNS del propio compose). En VPS sin Docker, livefeed.py
    # correría como servicio local y aquí se apuntaría a 127.0.0.1:
    # location /live-ws/ {
    #     proxy_pass http://127.0.0.1:8765/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 3600s;
    #     proxy_send_timeout 3600s;
    # }

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/meshtastic-es-map_access.log;
    error_log  /var/log/nginx/meshtastic-es-map_error.log;
}

