<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>En vivo · Red Meshtastic España</title>

<!-- Leaflet (self-hosted: sin dependencia de disponibilidad de unpkg) -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=1.9.4"/>
<script src="vendor/leaflet/leaflet.js?v=1.9.4"></script>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css?v=1.4.0"/>
</head>

<body class="live-page">

<!-- Header -->
<header>
  <a class="back-link" href="index.html">
    ← <span>Volver al mapa</span>
  </a>
  <div class="logo">
    <span>MESHTASTIC ESPAÑA <em>/ En vivo</em></span>
  </div>

  <div class="stats-bar">
    <div class="focus-wrap" id="focus-wrap">
      <input type="text" id="focus-input" class="search-input" placeholder="Enfocar nodo…" autocomplete="off"
             oninput="onFocusInput()" onkeydown="onFocusKey(event)" onfocus="onFocusInput()">
      <button class="focus-clear-btn" id="focus-clear-btn" onclick="clearFocus()" title="Quitar foco" style="display:none">✕</button>
      <div class="search-dropdown" id="focus-dropdown"></div>
    </div>
    <button class="live-pause-btn" id="live-pause-btn" onclick="togglePause()" title="Pausar/reanudar el feed">
      <svg id="pause-icon" viewBox="0 0 16 16" fill="none">
        <rect x="4" y="3" width="3" height="10" rx="1" fill="currentColor"/>
        <rect x="9" y="3" width="3" height="10" rx="1" fill="currentColor"/>
      </svg>
      <span id="pause-label">Pausar</span>
    </button>
    <div class="conn-badge" id="conn-badge">
      <span class="conn-dot"></span>
      <span id="conn-label">Conectando…</span>
    </div>
  </div>
</header>

<!-- Main -->
<div class="main">
  <div id="map">
    <button class="live-log-toggle-btn" id="live-log-toggle-btn" onclick="toggleLiveLogPanel()" title="Paquetes">
      <svg viewBox="0 0 16 16" fill="none">
        <rect x="2" y="3" width="12" height="2" rx="1" fill="currentColor"/>
        <rect x="2" y="7" width="12" height="2" rx="1" fill="currentColor"/>
        <rect x="2" y="11" width="7" height="2" rx="1" fill="currentColor"/>
      </svg>
    </button>
  </div>
  <div class="live-log" id="live-log">
    <div class="live-log-empty" id="live-log-empty">Esperando paquetes…</div>
  </div>
</div>

<!-- Modal: desglose de paquete -->
<div class="malconfig-modal" id="packet-detail-modal" onclick="if(event.target===this) closePacketDetail()">
  <div class="malconfig-inner" style="max-width:640px">
    <div class="malconfig-header">
      <div class="malconfig-title">Desglose del paquete</div>
      <button class="malconfig-close" onclick="closePacketDetail()" aria-label="Cerrar">✕</button>
    </div>
    <div class="malconfig-content">
      <div id="packet-detail-map" class="pkt-detail-map"></div>
      <div id="packet-detail-tables"></div>
    </div>
  </div>
</div>

<script src="js/state.js?v=1.4.0"></script>
<script src="js/live.js?v=1.4.0"></script>
</body>
</html>
